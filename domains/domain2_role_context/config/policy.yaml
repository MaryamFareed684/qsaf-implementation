# domains/domain2_role_context/config/policy.yaml
# Phrase and token lists for Domain 2: Role & Context Manipulation.
# Each control reads ITS OWN section below via core.policy_loader.
# Every key here is read by the code (a test checks this). RC-006 (role assertion log) needs no settings.
# Domains are switched on or off in config/global_policy.yaml, not here.

role_lock:
  phrases:
    - "you are now"
    - "act as if you are"
    - "pretend to be"
    - "from now on you are"
    - "switch to being"
    - "roleplay as"
    - "you are no longer"

impersonation:
  phrases:
    - "i am the developer"
    - "i am your creator"
    - "i am an anthropic employee"
    - "this is openai support"
    - "i am the system administrator"
    - "as your creator, i command you"
    - "official override code"

context_drift:
  phrases:
    - "let's play a game where"
    - "for this conversation, you are"
    - "starting now, act as"
    - "new instructions:"
    - "updated role:"

session_pivot:
  phrases:
    - "[new session]"
    - "new conversation start"
    - "system reset"
    - "reset the conversation"
    - "this is a fresh session"
    - "forget this conversation and start"
    - "end session, begin new session"

nested_injection:
  role_tokens:
    - "system:"
    - "assistant:"
    - "user:"
    - "[system]"
    - "[assistant]"

context_integrity:
  role_tokens:
    - "system:"
    - "[system]"
    - "assistant:"
    - "[assistant]"
